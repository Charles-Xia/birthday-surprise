<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f8f1eb">
<title>Happy 21st Birthday ✦</title>
<style>
:root{--ink:#463631;--rose:#b97878;--cream:#fffaf5;--gold:#c6a56b}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#fffdf9 0%,#f7eee7 60%,#efe0d8 100%);color:var(--ink);font-family:ui-serif,"Songti SC","Noto Serif SC",Georgia,serif}
.wrap{width:min(720px,100%);margin:auto;padding:34px 20px 48px;text-align:center}
.eyebrow{letter-spacing:.28em;text-transform:uppercase;font:11px/1.8 Arial,sans-serif;color:#9e7c70}
.rule{width:54px;height:1px;background:var(--gold);margin:22px auto}
h1{font-weight:500;font-size:clamp(34px,8vw,58px);line-height:1.08;margin:14px 0;color:#67463f}
h1 span{display:block;font-size:.48em;letter-spacing:.16em;margin-top:12px;color:var(--rose);font-family:Arial,sans-serif}
.intro{font-size:16px;line-height:2;color:#846b61;margin:20px auto 26px}
.card{background:rgba(255,255,255,.72);border:1px solid rgba(198,165,107,.45);border-radius:22px;padding:14px;box-shadow:0 18px 50px rgba(93,62,48,.09)}
video{display:block;width:100%;max-height:70vh;border-radius:14px;background:#201b19}
.tap{font:12px Arial,sans-serif;letter-spacing:.14em;color:#9b796d;margin:13px 0 2px}
.message{font-size:17px;line-height:2.05;margin:30px auto 18px;max-width:520px;white-space:pre-line}
.signature{color:var(--rose);font-size:15px;letter-spacing:.08em}
.footer{margin-top:36px;font:10px Arial,sans-serif;letter-spacing:.2em;color:#ad9589}
.sparkle{color:var(--gold);font-size:18px}
@media(min-width:600px){.wrap{padding-top:54px}.card{padding:18px}}
</style>
</head>
<body>
<main class="wrap">
  <div class="eyebrow">A little surprise, made just for you</div>
  <div class="rule"></div>
  <div class="sparkle">✦ &nbsp; ✧ &nbsp; ✦</div>
  <h1>祝你 21 岁生日快乐！<span>HAPPY 21ST BIRTHDAY</span></h1>
  <p class="intro">新的一岁，愿所有美好都如期而至。<br>这里有一份为你准备的小小惊喜。</p>
  <section class="card" aria-label="生日庆祝视频">
    <video controls playsinline preload="metadata" poster="">
      <source src="birthday-video.mp4" type="video/mp4">
      你的浏览器暂不支持视频播放，请尝试使用其他浏览器打开。
    </video>
    <div class="tap">PRESS PLAY & ENJOY YOUR SURPRISE</div>
  </section>
  <p class="message">祝你 21 岁生日快乐！🎂

愿你新的一岁，平安、自由、快乐，
有勇气奔赴热爱，也总有人分享喜悦。
愿每一个普通的日子都闪闪发光，
未来的每一步，都走向更喜欢的自己。</p>
  <div class="signature">愿你被世界温柔以待 ♡</div>
  <div class="rule"></div>
  <div class="footer">MADE WITH LOVE · JUST FOR YOU</div>
</main>
</body>
</html>
